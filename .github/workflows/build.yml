name: Zgradi Sauter APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Buildozer APK Gradnja
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Shrani APK datoteko za prenos
        uses: actions/upload-artifact@v4
        with:
          name: Sauter_App_Namestitev
          path: ${{ steps.buildozer.outputs.filename }}
